spring.application.name=library-manager

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/librarydb}
spring.data.mongodb.auto-index-creation=true

# JWT
jwt.secret=${JWT_SECRET:minha-chave-super-secreta-de-256-bits-para-jwt-seguro-aqui}
jwt.expiration=86400000

# OpenLibrary
openlibrary.base-url=https://openlibrary.org

# Server
server.port=8080

# Logging
logging.level.com.library=INFO
logging.level.org.springframework.security=WARN
