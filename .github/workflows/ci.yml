name: CI Pipeline - Biblioteca Pessoal

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Backend - Build, Test, Coverage
  # ─────────────────────────────────────────
  backend-ci:
    name: Backend CI (Spring Boot)
    runs-on: ubuntu-latest

    services:
      # MongoDB para testes que não usam Testcontainers
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: 🔍 Validar estrutura do pom.xml
        working-directory: backend
        run: mvn validate

      - name: 📦 Compilar projeto
        working-directory: backend
        run: mvn compile -q

      - name: 🧪 Executar testes unitários e integração
        working-directory: backend
        run: mvn test -Dspring.profiles.active=test
        env:
          MONGODB_URI: mongodb://localhost:27017/biblioteca_test

      - name: 📊 Verificar cobertura mínima de 80% (JaCoCo)
        working-directory: backend
        run: mvn jacoco:check

      - name: 📁 Gerar relatório JaCoCo XML
        working-directory: backend
        run: mvn jacoco:report

      - name: 📤 Upload relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 30

      - name: 🔎 SonarQube Analysis
        working-directory: backend
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=biblioteca-pessoal \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true  # Não quebra o pipeline se SonarQube estiver offline

      - name: 🏗️ Build JAR (sem testes, já executados)
        working-directory: backend
        run: mvn package -DskipTests

      - name: 📤 Upload JAR artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: backend/target/*.jar
          retention-days: 7

  # ─────────────────────────────────────────
  # JOB 2: Frontend - Build e Lint
  # ─────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (React)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: 🔍 Lint
        working-directory: frontend
        run: npm run lint

      - name: 🏗️ Build de produção
        working-directory: frontend
        run: npm run build

  # ─────────────────────────────────────────
  # JOB 3: Quality Gate Summary
  # ─────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: always()

    steps:
      - name: ✅ Verificar resultado dos jobs
        run: |
          echo "Backend CI: ${{ needs.backend-ci.result }}"
          echo "Frontend CI: ${{ needs.frontend-ci.result }}"
          if [[ "${{ needs.backend-ci.result }}" == "failure" || "${{ needs.frontend-ci.result }}" == "failure" ]]; then
            echo "❌ Quality Gate FALHOU"
            exit 1
          fi
          echo "✅ Quality Gate PASSOU"

  # ─────────────────────────────────────────
  # JOB 4: Deploy (apenas na branch main)
  # ─────────────────────────────────────────
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📥 Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: deploy/

      - name: 🚀 Deploy para staging
        run: |
          echo "Deploy do artefato para ambiente de staging..."
          echo "JAR disponível em: deploy/"
          ls deploy/
